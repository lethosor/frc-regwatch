name: Run (2027)

on:
  schedule:
  - cron: '0 7 * * *'
  - cron: '0 7/12 * 10 *'
  - cron: '0 7/12 * 11 *'
  - cron: '0 1/3 2 10 *'    # day after 2026 round 1 close
  - cron: '0 1/3 23 10 *'   # day after 2026 round 2 close
  - cron: '0 1/3 12-14 4 *'  # week 7 dcmp registration
  - cron: '0 1/3 19-21 4 *'  # week 8 cmp registration
  workflow_dispatch:

jobs:
  run:
    uses: ./.github/workflows/run.yml
    secrets: inherit
    with:
      year: 2027
